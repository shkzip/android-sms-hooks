buildscript {
    ext {
        // Sdk and tools
        compileSdkVersion = 36
        minSdkVersion = 28
        targetSdkVersion = 36

        // Dependencies
        activityVersion = "1.13.0"
        appCompatVersion = '1.8.0'
        constraintLayoutVersion = '2.2.2'
        espressoVersion = '3.7.0'
        fragmentVersion = "1.9.1"
        gradleVersion = '9.1.0'
        junitVersion = '6.1.3'
        kotlinVersion = "2.4.21"
        ktxVersion = '1.18.0'
        materialVersion = '1.14.0'
        navVersion = "2.10.2"
        okHttpVersion = '5.4.0'
        preferenceVersion = '1.2.1'
        testExtJunit = '1.3.0'
        workVersion = '2.12.0'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // Navigation Safe Args
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navVersion"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}